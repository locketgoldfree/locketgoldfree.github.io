<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Locket Gold Checker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --gold:#e7c45c;
    --gold2:#fff0a5;
    --bg:#050505;
    --card:rgba(255,255,255,.055);
    --border:rgba(255,255,255,.09);
    --muted:#888;
}

body{
    min-height:100vh;
    padding:25px 16px;

    font-family:Inter,Arial,sans-serif;
    color:#fff;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(226,188,71,.20),
            transparent 35%
        ),
        radial-gradient(
            circle at 0% 100%,
            rgba(226,188,71,.07),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #030303,
            #111,
            #050505
        );
}

.container{
    width:100%;
    max-width:560px;
    margin:auto;
}

/* =====================
   HEADER
===================== */

.logo{
    width:76px;
    height:76px;
    margin:10px auto 18px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #fff1a5,
            #c99829
        );

    box-shadow:
        0 0 50px rgba(230,190,70,.22),
        inset 0 1px rgba(255,255,255,.7);
}

.logo svg{
    width:40px;
    height:40px;
}

h1{
    text-align:center;
    font-size:38px;
    letter-spacing:-1.5px;
}

.subtitle{
    margin:8px 0 28px;

    text-align:center;

    color:#8d8d8d;
    font-size:14px;
}

/* =====================
   CARD
===================== */

.card{
    padding:25px;

    border:1px solid var(--border);
    border-radius:27px;

    background:var(--card);

    backdrop-filter:blur(25px);

    box-shadow:
        0 30px 90px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.035);
}

.label{
    display:block;

    margin-bottom:9px;

    color:#aaa;
    font-size:13px;
}

/* =====================
   INPUT
===================== */

.input-box{
    display:flex;
    align-items:center;

    overflow:hidden;

    border:1px solid #292929;
    border-radius:16px;

    background:#0a0a0a;

    transition:.2s;
}

.input-box:focus-within{
    border-color:#b99537;

    box-shadow:
        0 0 0 3px rgba(210,170,60,.08);
}

.prefix{
    padding-left:15px;

    color:#666;

    font-size:14px;
    white-space:nowrap;
}

input{
    width:100%;

    padding:16px 14px;

    border:0;
    outline:0;

    color:#fff;
    background:transparent;

    font-size:16px;
}

input::placeholder{
    color:#464646;
}

/* =====================
   BUTTON
===================== */

button{
    width:100%;

    margin-top:16px;
    padding:16px;

    border:0;
    border-radius:16px;

    cursor:pointer;

    color:#161208;

    font-weight:900;
    font-size:14px;
    letter-spacing:.4px;

    background:
        linear-gradient(
            135deg,
            #fff0a2,
            #d0a32f
        );

    box-shadow:
        0 12px 30px rgba(210,165,45,.17);

    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    filter:brightness(1.06);
}

button:active{
    transform:scale(.99);
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* =====================
   LOADING
===================== */

.loading{
    display:none;

    margin-top:20px;
    padding:17px;

    text-align:center;

    border:1px solid rgba(255,255,255,.07);
    border-radius:17px;

    background:rgba(255,255,255,.025);

    color:#aaa;

    font-size:13px;
}

.loading.show{
    display:block;
}

.loader{
    width:22px;
    height:22px;

    margin:0 auto 10px;

    border:2px solid #333;
    border-top-color:var(--gold);

    border-radius:50%;

    animation:spin .75s linear infinite;
}

.loading-bar{
    width:100%;
    height:3px;

    overflow:hidden;

    margin-top:12px;

    border-radius:10px;

    background:#222;
}

.loading-bar span{
    display:block;

    width:35%;
    height:100%;

    border-radius:10px;

    background:linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
    );

    animation:bar 1.1s infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes bar{
    from{
        transform:translateX(-120%);
    }

    to{
        transform:translateX(320%);
    }
}

/* =====================
   RESULT
===================== */

.result{
    display:none;

    margin-top:18px;
    padding:20px;

    border:1px solid rgba(255,255,255,.08);
    border-radius:21px;

    background:#090909;

    animation:resultIn .35s ease;
}

.result.show{
    display:block;
}

@keyframes resultIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =====================
   PROFILE
===================== */

.profile{
    display:flex;
    align-items:center;

    gap:14px;

    margin-bottom:18px;
}

.avatar-wrap{
    position:relative;
}

.avatar{
    width:68px;
    height:68px;

    display:block;

    object-fit:cover;

    border-radius:50%;

    border:2px solid #cba83f;

    box-shadow:
        0 0 22px rgba(220,180,60,.18);
}

.online{
    position:absolute;

    right:2px;
    bottom:2px;

    width:14px;
    height:14px;

    border:3px solid #090909;

    border-radius:50%;

    background:#61d987;
}

.display-name{
    font-size:19px;
    font-weight:800;
}

.username{
    margin-top:5px;

    color:#777;

    font-size:13px;
}

/* =====================
   GOLD BADGE
===================== */

.gold-badge{
    display:flex;
    align-items:center;

    gap:13px;

    padding:15px;

    border-radius:17px;

    border:1px solid rgba(226,190,80,.16);

    background:
        linear-gradient(
            135deg,
            rgba(238,203,93,.11),
            rgba(255,255,255,.025)
        );
}

.badge-icon{
    width:43px;
    height:43px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #fff0a2,
            #d0a22d
        );

    box-shadow:
        0 0 20px rgba(220,180,60,.18);
}

.badge-icon svg{
    width:24px;
    height:24px;
}

.badge-title{
    color:#c3a13e;

    font-size:10px;
    font-weight:900;

    letter-spacing:1.2px;
}

.badge-status{
    margin-top:4px;

    color:#f3da84;

    font-size:14px;
    font-weight:800;
}

/* =====================
   HISTORY
===================== */

.history{
    margin-top:22px;
}

.history-title{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:12px;

    color:#aaa;

    font-size:13px;
    font-weight:700;
}

.clear{
    width:auto;

    margin:0;
    padding:5px 9px;

    border:1px solid #292929;

    color:#777;

    background:#111;

    box-shadow:none;

    font-size:10px;
}

.history-list{
    display:flex;
    flex-direction:column;

    gap:8px;
}

.history-item{
    display:flex;
    align-items:center;

    gap:11px;

    padding:11px;

    border:1px solid rgba(255,255,255,.05);
    border-radius:13px;

    background:#0d0d0d;
}

.history-avatar{
    width:38px;
    height:38px;

    border-radius:50%;

    object-fit:cover;
}

.history-info{
    min-width:0;
    flex:1;
}

.history-name{
    overflow:hidden;

    color:#ddd;

    font-size:12px;
    font-weight:700;

    white-space:nowrap;
    text-overflow:ellipsis;
}

.history-user{
    margin-top:3px;

    color:#666;

    font-size:10px;
}

.history-gold{
    color:#dabb58;

    font-size:10px;
    font-weight:800;
}

.empty{
    padding:16px;

    text-align:center;

    color:#555;

    border:1px dashed #242424;
    border-radius:14px;

    font-size:11px;
}

/* =====================
   REQUEST ID
===================== */

.request-id{
    margin-top:14px;

    color:#505050;

    font-size:10px;
}

/* =====================
   FOOTER
===================== */

.footer{
    margin-top:20px;

    text-align:center;

    color:#4b4b4b;

    font-size:10px;
}

/* =====================
   MOBILE
===================== */

@media(max-width:520px){

    body{
        padding:18px 12px;
    }

    .logo{
        width:68px;
        height:68px;

        border-radius:22px;
    }

    h1{
        font-size:32px;
    }

    .subtitle{
        margin-bottom:22px;
    }

    .card{
        padding:18px;

        border-radius:22px;
    }

    .prefix{
        padding-left:12px;

        font-size:12px;
    }

    input{
        padding:15px 10px;

        font-size:15px;
    }

    .avatar{
        width:60px;
        height:60px;
    }

    .display-name{
        font-size:17px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- LOGO -->

    <div class="logo">

        <svg viewBox="0 0 100 100"
             fill="none"
             xmlns="http://www.w3.org/2000/svg">

            <path
                d="M50 5
                   L60 38
                   L95 50
                   L60 62
                   L50 95
                   L40 62
                   L5 50
                   L40 38
                   Z"
                fill="#17120A"/>

        </svg>

    </div>


    <h1>
        Locket Gold
    </h1>

    <div class="subtitle">
        Kiểm tra trạng thái tài khoản
    </div>


    <!-- MAIN CARD -->

    <div class="card">

        <label class="label">
            Locket username
        </label>

        <div class="input-box">

            <span class="prefix">
                locket.cam/
            </span>

            <input
                id="username"
                type="text"
                placeholder="username"
                autocomplete="off"
            >

        </div>


        <button id="checkBtn">
            KIỂM TRA NGAY
        </button>


        <!-- LOADING -->

        <div
            class="loading"
            id="loading"
        >

            <div class="loader"></div>

            <div>
                Đang kiểm tra tài khoản...
            </div>

            <div class="loading-bar">
                <span></span>
            </div>

        </div>


        <!-- RESULT -->

        <div
            class="result"
            id="result"
        >

            <!-- PROFILE -->

            <div class="profile">

                <div class="avatar-wrap">

                    <img
                        id="avatar"
                        class="avatar"
                        src=""
                        alt="Avatar"
                    >

                    <span class="online"></span>

                </div>


                <div>

                    <div
                        class="display-name"
                        id="displayName"
                    >
                        -
                    </div>

                    <div
                        class="username"
                        id="usernameResult"
                    >
                        @username
                    </div>

                </div>

            </div>


            <!-- GOLD -->

            <div class="gold-badge">

                <div class="badge-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <path
                            d="M12 2
                               L14.7 9.3
                               L22 12
                               L14.7 14.7
                               L12 22
                               L9.3 14.7
                               L2 12
                               L9.3 9.3
                               Z"
                            fill="#17120A"
                        />

                    </svg>

                </div>


                <div>

                    <div class="badge-title">
                        LOCKET GOLD
                    </div>

                    <div
                        class="badge-status"
                        id="goldStatus"
                    >
                        ĐÃ LÊN GOLD ✓
                    </div>

                </div>

            </div>


            <div
                class="request-id"
                id="requestId"
            ></div>

        </div>


        <!-- HISTORY -->

        <div class="history">

            <div class="history-title">

                <span>
                    Lịch sử kiểm tra
                </span>

                <button
                    class="clear"
                    id="clearHistory"
                >
                    XÓA
                </button>

            </div>


            <div
                class="history-list"
                id="historyList"
            >

                <div class="empty">
                    Chưa có lịch sử kiểm tra
                </div>

            </div>

        </div>

    </div>


    <div class="footer">
        Locket Gold Checker
    </div>

</div>


<script>

/* ==================================================
   SUPABASE
================================================== */

/*
 * Điền thông tin Supabase của bạn khi muốn
 * lưu request/kết quả lên Supabase.
 *
 * Nếu để trống, web vẫn chạy và dùng localStorage.
 */

const SUPABASE_URL = "";

const SUPABASE_ANON_KEY = "";

let sb = null;

if(
    SUPABASE_URL &&
    SUPABASE_ANON_KEY
){
    sb = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );
}


/* ==================================================
   ELEMENTS
================================================== */

const input =
    document.getElementById("username");

const checkBtn =
    document.getElementById("checkBtn");

const loading =
    document.getElementById("loading");

const result =
    document.getElementById("result");

const avatar =
    document.getElementById("avatar");

const displayName =
    document.getElementById("displayName");

const usernameResult =
    document.getElementById("usernameResult");

const goldStatus =
    document.getElementById("goldStatus");

const requestId =
    document.getElementById("requestId");

const historyList =
    document.getElementById("historyList");

const clearHistory =
    document.getElementById("clearHistory");


/* ==================================================
   CLEAN USERNAME
================================================== */

function cleanUsername(value){

    value = String(value || "").trim();

    value = value.replace(
        /^https?:\/\/(www\.)?locket\.cam\//i,
        ""
    );

    value = value.replace(
        /^www\.locket\.cam\//i,
        ""
    );

    value = value.replace(
        /^locket\.cam\//i,
        ""
    );

    value = value.split(/[?#]/)[0];

    value = value
        .replace(/^\/+/,"")
        .replace(/\/+$/,"");

    return value.trim();
}


/* ==================================================
   ESCAPE
================================================== */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ==================================================
   REQUEST ID
================================================== */

function createRequestId(){

    return "LK-" +
        Math.random()
            .toString(36)
            .substring(2,8)
            .toUpperCase();
}


/* ==================================================
   LOCAL HISTORY
================================================== */

function getHistory(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "locket_gold_history"
            )
        ) || [];

    }catch{

        return [];

    }
}


function saveHistory(item){

    const history =
        getHistory();

    /*
     * Đưa kết quả mới lên đầu
     */

    history.unshift(item);

    /*
     * Giữ tối đa 10 lần
     */

    const limited =
        history.slice(0,10);

    localStorage.setItem(
        "locket_gold_history",
        JSON.stringify(limited)
    );

    renderHistory();
}


function renderHistory(){

    const history =
        getHistory();

    if(!history.length){

        historyList.innerHTML =
            `<div class="empty">
                Chưa có lịch sử kiểm tra
            </div>`;

        return;
    }


    historyList.innerHTML =
        history.map(item => `

            <div class="history-item">

                <img
                    class="history-avatar"
                    src="${escapeHTML(item.avatar)}"
                    alt=""
                >

                <div class="history-info">

                    <div class="history-name">
                        ${escapeHTML(item.name)}
                    </div>

                    <div class="history-user">
                        @${escapeHTML(item.username)}
                    </div>

                </div>

                <div class="history-gold">
                    ${item.gold ? "GOLD ✓" : "NO GOLD"}
                </div>

            </div>

        `).join("");
}


/* ==================================================
   SUPABASE SAVE
================================================== */

async function saveToSupabase(item){

    if(!sb) return;

    try{

        await sb
            .from("requests")
            .insert({

                username:item.username,

                display_name:item.name,

                avatar_url:item.avatar,

                gold_status:item.gold,

                status:"done",

                result:
                    item.gold
                        ? "Đã lên Locket Gold"
                        : "Chưa lên Locket Gold"

            });

    }catch(error){

        console.error(
            "Supabase error:",
            error
        );

    }
}


/* ==================================================
   DEMO CHECK
================================================== */

async function checkAccount(){

    const username =
        cleanUsername(input.value);


    if(!username){

        result.classList.add("show");

        displayName.textContent =
            "Chưa nhập username";

        usernameResult.textContent =
            "";

        goldStatus.textContent =
            "Vui lòng nhập username";

        return;
    }


    input.value = username;

    checkBtn.disabled = true;

    result.classList.remove("show");

    loading.classList.add("show");


    /*
     * Loading demo
     */

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                1800
            )
    );


    /*
     * =============================================
     * DỮ LIỆU DEMO
     * =============================================
     *
     * Sau này thay phần này bằng dữ liệu thật.
     */

    const name =
        username.toLowerCase() === "tudzpromax"
            ? "Tú Pro Max"
            : username;


    const avatarURL =
        "https://i.pravatar.cc/300?u=" +
        encodeURIComponent(username);


    const isGold = true;


    const id =
        createRequestId();


    /*
     * HIỂN THỊ
     */

    avatar.src =
        avatarURL;

    displayName.textContent =
        name;

    usernameResult.textContent =
        "@" + username;

    goldStatus.textContent =
        isGold
            ? "ĐÃ LÊN GOLD ✓"
            : "CHƯA LÊN GOLD";


    requestId.textContent =
        "ID yêu cầu: " + id;


    result.classList.add("show");


    /*
     * LƯU HISTORY
     */

    const item = {

        id:id,

        username:username,

        name:name,

        avatar:avatarURL,

        gold:isGold,

        time:
            new Date().toISOString()

    };


    saveHistory(item);

    await saveToSupabase(item);


    checkBtn.disabled = false;

    loading.classList.remove("show");

}


/* ==================================================
   EVENTS
================================================== */

checkBtn.addEventListener(
    "click",
    checkAccount
);


input.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            checkAccount();

        }

    }
);


clearHistory.addEventListener(
    "click",
    () => {

        localStorage.removeItem(
            "locket_gold_history"
        );

        renderHistory();

    }
);


/* ==================================================
   INPUT AUTO CLEAN
================================================== */

input.addEventListener(
    "input",
    () => {

        const value =
            input.value;

        if(
            /locket\.cam\//i.test(value)
        ){

            input.value =
                cleanUsername(value);

        }

    }
);


/* ==================================================
   INIT
================================================== */

renderHistory();

</script>

</body>
</html>
