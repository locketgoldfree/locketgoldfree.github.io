<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Locket Gold Checker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --gold:#e6c35c;
    --gold-light:#fff1a8;
    --bg:#050505;
    --card:rgba(255,255,255,.055);
    --border:rgba(255,255,255,.09);
}

body{

    min-height:100vh;

    padding:30px 15px;

    color:white;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(225,185,60,.20),
            transparent 35%
        ),

        radial-gradient(
            circle at 0% 100%,
            rgba(225,185,60,.07),
            transparent 30%
        ),

        linear-gradient(
            145deg,
            #020202,
            #101010,
            #030303
        );
}

.container{

    width:100%;

    max-width:560px;

    margin:auto;
}


/* =========================
   LOGO
========================= */

.logo{

    width:76px;
    height:76px;

    margin:10px auto 18px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #fff2a8,
            #c99b2d
        );

    box-shadow:
        0 0 55px rgba(230,190,70,.22),
        inset 0 1px rgba(255,255,255,.7);
}

.logo svg{

    width:40px;
    height:40px;
}


/* =========================
   TITLE
========================= */

h1{

    text-align:center;

    font-size:38px;

    letter-spacing:-1.5px;
}

.subtitle{

    margin-top:8px;
    margin-bottom:28px;

    text-align:center;

    color:#888;

    font-size:14px;
}


/* =========================
   CARD
========================= */

.card{

    padding:25px;

    border:
        1px solid var(--border);

    border-radius:27px;

    background:
        rgba(255,255,255,.045);

    backdrop-filter:
        blur(25px);

    box-shadow:
        0 30px 90px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.035);
}


/* =========================
   LABEL
========================= */

.label{

    display:block;

    margin-bottom:9px;

    color:#aaa;

    font-size:13px;
}


/* =========================
   INPUT
========================= */

.input-box{

    display:flex;

    align-items:center;

    overflow:hidden;

    border:
        1px solid #292929;

    border-radius:16px;

    background:#090909;

    transition:.2s;
}

.input-box:focus-within{

    border-color:#b99537;

    box-shadow:
        0 0 0 3px
        rgba(210,170,60,.08);
}

.prefix{

    padding-left:15px;

    color:#626262;

    font-size:14px;

    white-space:nowrap;
}

input{

    width:100%;

    padding:16px 14px;

    border:0;

    outline:0;

    color:white;

    background:transparent;

    font-size:16px;
}

input::placeholder{

    color:#444;
}


/* =========================
   BUTTON
========================= */

button{

    width:100%;

    margin-top:16px;

    padding:16px;

    border:0;

    border-radius:16px;

    cursor:pointer;

    color:#171207;

    font-weight:900;

    font-size:14px;

    letter-spacing:.5px;

    background:
        linear-gradient(
            135deg,
            #fff1a2,
            #d0a32f
        );

    box-shadow:
        0 12px 30px
        rgba(210,165,45,.18);

    transition:.2s;
}

button:hover{

    transform:translateY(-2px);

    filter:brightness(1.06);
}

button:active{

    transform:scale(.99);
}

button:disabled{

    opacity:.55;

    cursor:not-allowed;

    transform:none;
}


/* =========================
   LOADING
========================= */

.loading{

    display:none;

    margin-top:20px;

    padding:18px;

    text-align:center;

    border:
        1px solid rgba(255,255,255,.07);

    border-radius:17px;

    background:
        rgba(255,255,255,.025);

    color:#aaa;

    font-size:13px;
}

.loading.show{

    display:block;
}

.loader{

    width:25px;
    height:25px;

    margin:
        0 auto 11px;

    border:
        2px solid #292929;

    border-top-color:
        var(--gold);

    border-radius:50%;

    animation:
        spin .75s linear infinite;
}

.loading-bar{

    width:100%;
    height:3px;

    overflow:hidden;

    margin-top:12px;

    border-radius:20px;

    background:#222;
}

.loading-bar span{

    display:block;

    width:35%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            transparent
        );

    animation:
        bar 1.1s infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}

@keyframes bar{

    from{
        transform:translateX(-120%);
    }

    to{
        transform:translateX(320%);
    }
}


/* =========================
   RESULT
========================= */

.result{

    display:none;

    margin-top:18px;

    padding:20px;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:21px;

    background:#090909;

    animation:
        resultIn .35s ease;
}

.result.show{

    display:block;
}

@keyframes resultIn{

    from{

        opacity:0;

        transform:
            translateY(10px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}


/* =========================
   PROFILE
========================= */

.profile{

    display:flex;

    align-items:center;

    gap:14px;

    margin-bottom:18px;
}

.avatar-wrap{

    position:relative;
}

.avatar{

    width:68px;
    height:68px;

    display:block;

    object-fit:cover;

    border:
        2px solid #cba83f;

    border-radius:50%;

    background:#151515;

    box-shadow:
        0 0 22px
        rgba(220,180,60,.18);
}

.online{

    position:absolute;

    right:2px;
    bottom:2px;

    width:14px;
    height:14px;

    border:
        3px solid #090909;

    border-radius:50%;

    background:#61d987;
}

.display-name{

    font-size:19px;

    font-weight:800;
}

.username{

    margin-top:5px;

    color:#777;

    font-size:13px;
}


/* =========================
   GOLD BADGE
========================= */

.gold-badge{

    display:flex;

    align-items:center;

    gap:13px;

    padding:15px;

    border:
        1px solid
        rgba(226,190,80,.16);

    border-radius:17px;

    background:
        linear-gradient(
            135deg,
            rgba(238,203,93,.11),
            rgba(255,255,255,.025)
        );
}

.badge-icon{

    width:43px;
    height:43px;

    flex-shrink:0;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #fff0a2,
            #d0a22d
        );

    box-shadow:
        0 0 20px
        rgba(220,180,60,.18);
}

.badge-icon svg{

    width:24px;
    height:24px;
}

.badge-title{

    color:#c3a13e;

    font-size:10px;

    font-weight:900;

    letter-spacing:1.2px;
}

.badge-status{

    margin-top:4px;

    color:#f3da84;

    font-size:14px;

    font-weight:800;
}


/* =========================
   ERROR
========================= */

.error{

    margin-top:14px;

    padding:13px;

    border:
        1px solid
        rgba(255,80,80,.15);

    border-radius:14px;

    color:#ff8585;

    background:
        rgba(255,50,50,.05);

    font-size:12px;

    line-height:1.5;
}


/* =========================
   REQUEST ID
========================= */

.request-id{

    margin-top:14px;

    color:#4f4f4f;

    font-size:10px;
}


/* =========================
   HISTORY
========================= */

.history{

    margin-top:22px;
}

.history-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:12px;

    color:#aaa;

    font-size:13px;

    font-weight:700;
}

.clear{

    width:auto;

    margin:0;

    padding:6px 9px;

    border:
        1px solid #292929;

    color:#777;

    background:#111;

    box-shadow:none;

    font-size:10px;
}

.history-list{

    display:flex;

    flex-direction:column;

    gap:8px;
}

.history-item{

    display:flex;

    align-items:center;

    gap:11px;

    padding:11px;

    border:
        1px solid
        rgba(255,255,255,.05);

    border-radius:13px;

    background:#0d0d0d;
}

.history-avatar{

    width:38px;
    height:38px;

    object-fit:cover;

    border-radius:50%;

    background:#181818;
}

.history-info{

    min-width:0;

    flex:1;
}

.history-name{

    overflow:hidden;

    color:#ddd;

    font-size:12px;

    font-weight:700;

    white-space:nowrap;

    text-overflow:ellipsis;
}

.history-user{

    margin-top:3px;

    color:#666;

    font-size:10px;
}

.history-gold{

    color:#dabb58;

    font-size:10px;

    font-weight:800;
}

.empty{

    padding:16px;

    text-align:center;

    color:#555;

    border:
        1px dashed #242424;

    border-radius:14px;

    font-size:11px;
}


/* =========================
   FOOTER
========================= */

.footer{

    margin-top:20px;

    text-align:center;

    color:#464646;

    font-size:10px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:520px){

    body{

        padding:
            18px 12px;
    }

    .logo{

        width:68px;
        height:68px;

        border-radius:22px;
    }

    h1{

        font-size:32px;
    }

    .subtitle{

        margin-bottom:22px;
    }

    .card{

        padding:18px;

        border-radius:22px;
    }

    .prefix{

        padding-left:12px;

        font-size:12px;
    }

    input{

        padding:
            15px 10px;

        font-size:15px;
    }

    .avatar{

        width:60px;
        height:60px;
    }

    .display-name{

        font-size:17px;
    }
}

</style>

</head>


<body>

<div class="container">


    <!-- LOGO -->

    <div class="logo">

        <svg
            viewBox="0 0 100 100"
            fill="none"
        >

            <path
                d="
                    M50 5
                    L60 38
                    L95 50
                    L60 62
                    L50 95
                    L40 62
                    L5 50
                    L40 38
                    Z
                "
                fill="#17120A"
            />

        </svg>

    </div>


    <h1>
        Locket Gold
    </h1>


    <div class="subtitle">
        Kiểm tra thông tin profile
    </div>


    <div class="card">


        <!-- INPUT -->

        <label class="label">
            Locket username
        </label>


        <div class="input-box">

            <span class="prefix">
                locket.cam/
            </span>

            <input
                id="username"
                type="text"
                placeholder="username"
                autocomplete="off"
            >

        </div>


        <button
            id="checkBtn"
        >
            KIỂM TRA NGAY
        </button>


        <!-- LOADING -->

        <div
            class="loading"
            id="loading"
        >

            <div class="loader"></div>

            <div>
                Đang kiểm tra profile...
            </div>

            <div class="loading-bar">
                <span></span>
            </div>

        </div>


        <!-- ERROR -->

        <div
            class="error"
            id="error"
            style="display:none"
        ></div>


        <!-- RESULT -->

        <div
            class="result"
            id="result"
        >


            <div class="profile">


                <div class="avatar-wrap">

                    <img
                        id="avatar"
                        class="avatar"
                        alt="Avatar"
                    >

                    <span
                        class="online"
                    ></span>

                </div>


                <div>

                    <div
                        class="display-name"
                        id="displayName"
                    >
                        -
                    </div>

                    <div
                        class="username"
                        id="usernameResult"
                    >
                        @username
                    </div>

                </div>

            </div>


            <!-- GOLD -->

            <div class="gold-badge">

                <div class="badge-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                    >

                        <path
                            d="
                                M12 2
                                L14.7 9.3
                                L22 12
                                L14.7 14.7
                                L12 22
                                L9.3 14.7
                                L2 12
                                L9.3 9.3
                                Z
                            "
                            fill="#17120A"
                        />

                    </svg>

                </div>


                <div>

                    <div class="badge-title">
                        LOCKET GOLD
                    </div>

                    <div
                        class="badge-status"
                        id="goldStatus"
                    >
                        CHƯA KIỂM TRA
                    </div>

                </div>

            </div>


            <div
                class="request-id"
                id="requestId"
            ></div>

        </div>


        <!-- HISTORY -->

        <div class="history">

            <div class="history-title">

                <span>
                    Lịch sử kiểm tra
                </span>

                <button
                    class="clear"
                    id="clearHistory"
                >
                    XÓA
                </button>

            </div>


            <div
                class="history-list"
                id="historyList"
            >

                <div class="empty">
                    Chưa có lịch sử kiểm tra
                </div>

            </div>

        </div>

    </div>


    <div class="footer">
        Locket Gold Checker
    </div>

</div>


<script>

/* ============================================
   SUPABASE
============================================ */

const SUPABASE_URL =
    "https://eczhimfkxmdvvunftxtz.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_syLke_RRmyKNfh_p61umwg_8gZzM3So";


const sb =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ============================================
   ELEMENTS
============================================ */

const input =
    document.getElementById(
        "username"
    );

const checkBtn =
    document.getElementById(
        "checkBtn"
    );

const loading =
    document.getElementById(
        "loading"
    );

const result =
    document.getElementById(
        "result"
    );

const errorBox =
    document.getElementById(
        "error"
    );

const avatar =
    document.getElementById(
        "avatar"
    );

const displayName =
    document.getElementById(
        "displayName"
    );

const usernameResult =
    document.getElementById(
        "usernameResult"
    );

const goldStatus =
    document.getElementById(
        "goldStatus"
    );

const requestId =
    document.getElementById(
        "requestId"
    );

const historyList =
    document.getElementById(
        "historyList"
    );

const clearHistory =
    document.getElementById(
        "clearHistory"
    );


/* ============================================
   USERNAME CLEAN
============================================ */

function cleanUsername(value){

    let username =
        String(value || "")
        .trim();

    username =
        username.replace(
            /^https?:\/\/(www\.)?locket\.cam\//i,
            ""
        );

    username =
        username.replace(
            /^www\.locket\.cam\//i,
            ""
        );

    username =
        username.replace(
            /^locket\.cam\//i,
            ""
        );

    username =
        username.split(/[?#]/)[0];

    username =
        username
        .replace(/^\/+/,"")
        .replace(/\/+$/,"");

    return username.trim();
}


/* ============================================
   ESCAPE HTML
============================================ */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ============================================
   REQUEST ID
============================================ */

function createRequestId(){

    return "LK-" +
        Math.random()
        .toString(36)
        .substring(2,8)
        .toUpperCase();
}


/* ============================================
   FALLBACK AVATAR
============================================ */

function avatarFallback(username){

    return (
        "https://ui-avatars.com/api/" +
        "?name=" +
        encodeURIComponent(
            username.substring(0,2)
        ) +
        "&background=161616" +
        "&color=e7c45c" +
        "&size=200"
    );
}


/* ============================================
   GET PROFILE
============================================ */

async function getLocketProfile(username){

    const response =
        await sb.functions.invoke(
            "locket-profile",
            {
                body:{
                    username:username
                }
            }
        );

    if(response.error){

        throw new Error(
            response.error.message ||
            "Không thể gọi Edge Function."
        );
    }

    const data =
        response.data;

    if(!data){

        throw new Error(
            "Supabase không trả dữ liệu."
        );
    }

    if(!data.success){

        throw new Error(
            data.error ||
            "Không lấy được profile."
        );
    }

    return data;
}


/* ============================================
   SAVE SUPABASE
============================================ */

async function saveRequest(profile){

    const id =
        createRequestId();

    const { error } =
        await sb
        .from("requests")
        .insert({

            username:
                profile.username,

            display_name:
                profile.display_name,

            avatar_url:
                profile.avatar_url,

            gold_status:
                null,

            status:
                "completed",

            result:
                "Đã lấy thông tin profile"

        });

    if(error){

        console.error(
            "Supabase insert:",
            error
        );

    }

    return id;
}


/* ============================================
   LOAD HISTORY
============================================ */

async function loadHistory(){

    const { data, error } =
        await sb
        .from("requests")
        .select(
            "username,display_name,avatar_url,gold_status,created_at"
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        )
        .limit(10);

    if(error){

        console.error(
            "History:",
            error
        );

        return;
    }

    renderHistory(
        data || []
    );
}


/* ============================================
   RENDER HISTORY
============================================ */

function renderHistory(items){

    if(!items.length){

        historyList.innerHTML =
            `
            <div class="empty">
                Chưa có lịch sử kiểm tra
            </div>
            `;

        return;
    }


    historyList.innerHTML =
        items.map(item => {

            const image =
                item.avatar_url ||
                avatarFallback(
                    item.username
                );

            const gold =
                item.gold_status === true
                    ? "GOLD ✓"
                    : item.gold_status === false
                        ? "NO GOLD"
                        : "CHECKED";

            return `
                <div class="history-item">

                    <img
                        class="history-avatar"
                        src="${escapeHTML(image)}"
                        onerror="this.src='${avatarFallback(item.username)}'"
                    >

                    <div class="history-info">

                        <div class="history-name">
                            ${escapeHTML(
                                item.display_name ||
                                item.username
                            )}
                        </div>

                        <div class="history-user">
                            @${escapeHTML(
                                item.username
                            )}
                        </div>

                    </div>

                    <div class="history-gold">
                        ${gold}
                    </div>

                </div>
            `;

        }).join("");
}


/* ============================================
   CHECK
============================================ */

async function checkAccount(){

    const username =
        cleanUsername(
            input.value
        );


    if(!username){

        showError(
            "Vui lòng nhập username."
        );

        return;
    }


    if(
        !/^[a-zA-Z0-9._-]{1,100}$/
        .test(username)
    ){

        showError(
            "Username không hợp lệ."
        );

        return;
    }


    input.value =
        username;


    checkBtn.disabled =
        true;

    loading.classList.add(
        "show"
    );

    result.classList.remove(
        "show"
    );

    errorBox.style.display =
        "none";


    try{

        const profile =
            await getLocketProfile(
                username
            );


        /* =========================
           PROFILE
        ========================= */

        displayName.textContent =
            profile.display_name ||
            profile.username;


        usernameResult.textContent =
            "@" +
            profile.username;


        const image =
            profile.avatar_url ||
            avatarFallback(
                profile.username
            );


        avatar.src =
            image;


        avatar.onerror =
            () => {

                avatar.src =
                    avatarFallback(
                        profile.username
                    );

            };


        /* =========================
           GOLD
        ========================= */

        /*
         * Chưa có nguồn dữ liệu Gold
         * nên không giả mạo kết quả.
         */

        goldStatus.textContent =
            "CHƯA CÓ DỮ LIỆU";


        /* =========================
           SAVE
        ========================= */

        const id =
            await saveRequest(
                profile
            );


        requestId.textContent =
            "ID yêu cầu: " +
            id;


        result.classList.add(
            "show"
        );


        await loadHistory();


    }catch(error){

        console.error(error);

        showError(
            error.message ||
            "Có lỗi xảy ra."
        );

    }finally{

        loading.classList.remove(
            "show"
        );

        checkBtn.disabled =
            false;

    }
}


/* ============================================
   ERROR
============================================ */

function showError(message){

    result.classList.remove(
        "show"
    );

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";
}


/* ============================================
   EVENTS
============================================ */

checkBtn.addEventListener(
    "click",
    checkAccount
);


input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            checkAccount();

        }

    }
);


input.addEventListener(
    "input",
    () => {

        const value =
            input.value;

        if(
            /locket\.cam\//i.test(
                value
            )
        ){

            input.value =
                cleanUsername(
                    value
                );

        }

    }
);


/* ============================================
   CLEAR HISTORY
============================================ */

clearHistory.addEventListener(
    "click",
    async () => {

        const confirmed =
            confirm(
                "Xóa toàn bộ lịch sử?"
            );

        if(!confirmed) return;


        const { error } =
            await sb
            .from("requests")
            .delete()
            .not(
                "id",
                "is",
                null
            );


        if(error){

            console.error(error);

            alert(
                "Không thể xóa lịch sử."
            );

            return;
        }


        renderHistory([]);
    }
);
