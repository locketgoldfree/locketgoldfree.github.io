```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Locket Gold Checker</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    font-family:Inter,Arial,sans-serif;
    color:#fff;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(255,214,92,.22),
            transparent 38%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(255,190,60,.08),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #050505,
            #111,
            #050505
        );
}

.container{
    width:100%;
    max-width:520px;
}

/* LOGO */

.logo{
    width:78px;
    height:78px;
    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:24px;

    font-size:40px;

    background:
        linear-gradient(
            145deg,
            #fff1a8,
            #d8ad39
        );

    box-shadow:
        0 0 50px rgba(255,214,80,.22),
        inset 0 1px rgba(255,255,255,.7);
}

/* TITLE */

h1{
    text-align:center;
    font-size:38px;
    letter-spacing:-1.5px;
}

.subtitle{
    margin-top:8px;
    margin-bottom:30px;

    text-align:center;

    color:#929292;
    font-size:14px;
}

/* CARD */

.card{
    padding:26px;

    border:1px solid rgba(255,255,255,.09);
    border-radius:26px;

    background:rgba(255,255,255,.045);

    backdrop-filter:blur(22px);

    box-shadow:
        0 30px 90px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.04);
}

/* LABEL */

.label{
    display:block;

    margin-bottom:10px;

    color:#aaa;

    font-size:13px;
}

/* INPUT */

.input-box{
    display:flex;
    align-items:center;

    overflow:hidden;

    border:1px solid #292929;
    border-radius:16px;

    background:#0b0b0b;

    transition:.2s;
}

.input-box:focus-within{
    border-color:#b99535;

    box-shadow:
        0 0 0 3px rgba(190,150,45,.08);
}

.prefix{
    padding-left:15px;

    color:#6e6e6e;

    font-size:14px;

    white-space:nowrap;
}

input{
    width:100%;

    padding:16px 14px;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:16px;
}

input::placeholder{
    color:#4f4f4f;
}

/* BUTTON */

button{
    width:100%;

    margin-top:17px;

    padding:16px;

    border:0;
    border-radius:16px;

    cursor:pointer;

    color:#18130a;

    font-size:14px;
    font-weight:900;
    letter-spacing:.5px;

    background:
        linear-gradient(
            135deg,
            #fff0a5,
            #d3a32d
        );

    box-shadow:
        0 12px 30px rgba(210,165,45,.16);

    transition:.2s;
}

button:hover{
    transform:translateY(-2px);

    filter:brightness(1.06);
}

button:active{
    transform:translateY(0);
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

/* LOADING */

.loading{
    display:none;

    margin-top:18px;

    text-align:center;

    color:#999;

    font-size:13px;
}

.loading.show{
    display:block;
}

.spinner{
    display:inline-block;

    width:16px;
    height:16px;

    margin-right:7px;

    vertical-align:-3px;

    border:2px solid #3b3b3b;
    border-top-color:#e2bd58;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* RESULT */

.result{
    display:none;

    margin-top:18px;
    padding:20px;

    border:1px solid rgba(255,255,255,.08);
    border-radius:19px;

    background:#0b0b0b;

    animation:resultIn .3s ease;
}

.result.show{
    display:block;
}

@keyframes resultIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.result-header{
    display:flex;
    align-items:center;
    gap:10px;

    margin-bottom:15px;

    color:#e6c45d;

    font-size:13px;
    font-weight:800;
}

.status-dot{
    width:9px;
    height:9px;

    border-radius:50%;

    background:#e6c45d;

    box-shadow:
        0 0 12px rgba(230,196,93,.7);
}

.username-result{
    margin-bottom:13px;

    color:#777;

    font-size:13px;
}

.username-result strong{
    color:#ddd;
}

.result-content{
    padding:15px;

    border-radius:13px;

    background:#111;

    color:#ddd;

    line-height:1.6;

    font-size:14px;

    white-space:pre-wrap;
}

.request-id{
    margin-top:13px;

    color:#555;

    font-size:11px;
}

/* FOOTER */

.footer{
    margin-top:19px;

    text-align:center;

    color:#4e4e4e;

    font-size:11px;
}

/* MOBILE */

@media(max-width:500px){

    h1{
        font-size:32px;
    }

    .card{
        padding:20px;
    }

    .logo{
        width:70px;
        height:70px;
        font-size:34px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        ✦
    </div>

    <h1>
        Locket Gold
    </h1>

    <div class="subtitle">
        Kiểm tra trạng thái tài khoản
    </div>

    <div class="card">

        <label class="label">
            Locket username
        </label>

        <div class="input-box">

            <span class="prefix">
                locket.cam/
            </span>

            <input
                id="username"
                type="text"
                placeholder="username"
                autocomplete="off"
            >

        </div>

        <button id="checkBtn">
            KIỂM TRA NGAY
        </button>

        <div
            class="loading"
            id="loading"
        >
            <span class="spinner"></span>
            Đang kiểm tra...
        </div>

        <div
            class="result"
            id="result"
        >

            <div class="result-header">

                <span class="status-dot"></span>

                KẾT QUẢ KIỂM TRA

            </div>

            <div
                class="username-result"
                id="usernameResult"
            ></div>

            <div
                class="result-content"
                id="resultContent"
            ></div>

            <div
                class="request-id"
                id="requestId"
            ></div>

        </div>

    </div>

    <div class="footer">
        Locket Gold Checker • Demo
    </div>

</div>

<script>

const input =
    document.getElementById("username");

const checkBtn =
    document.getElementById("checkBtn");

const loading =
    document.getElementById("loading");

const result =
    document.getElementById("result");

const usernameResult =
    document.getElementById("usernameResult");

const resultContent =
    document.getElementById("resultContent");

const requestId =
    document.getElementById("requestId");


/* =========================
   LẤY USERNAME
========================= */

function cleanUsername(value){

    value = value.trim();

    /*
        https://locket.cam/abc
        http://locket.cam/abc
        locket.cam/abc
        abc
    */

    value = value.replace(
        /^https?:\/\/(www\.)?locket\.cam\//i,
        ""
    );

    value = value.replace(
        /^www\.locket\.cam\//i,
        ""
    );

    value = value.replace(
        /^locket\.cam\//i,
        ""
    );

    value = value.split(/[?#]/)[0];

    value = value
        .replace(/^\/+/,"")
        .replace(/\/+$/,"");

    return value.trim();
}


/* =========================
   INPUT TỰ ĐỘNG XỬ LÝ
========================= */

input.addEventListener(
    "input",
    () => {

        const value =
            cleanUsername(input.value);

        /*
         * Nếu người dùng dán:
         *
         * locket.cam/tulol
         *
         * thì input sẽ thành:
         *
         * tulol
         */

        if(
            input.value.includes("locket.cam/")
        ){
            input.value = value;
        }

    }
);


/* =========================
   KIỂM TRA DEMO
========================= */

async function checkAccount(){

    const username =
        cleanUsername(input.value);

    if(!username){

        resultContent.textContent =
            "Vui lòng nhập username.";

        usernameResult.textContent = "";

        requestId.textContent = "";

        result.classList.add("show");

        return;
    }


    input.value = username;

    checkBtn.disabled = true;

    loading.classList.add("show");

    result.classList.remove("show");


    /*
     * Demo loading
     */

    await new Promise(
        resolve =>
            setTimeout(resolve,1800)
    );


    /*
     * Tạo ID demo
     */

    const id =
        "LK-" +
        Math.random()
            .toString(36)
            .substring(2,8)
            .toUpperCase();


    usernameResult.innerHTML =
        "Username: <strong>@" +
        escapeHTML(username) +
        "</strong>";


    resultContent.textContent =
`Yêu cầu đã được tiếp nhận.

Username: @${username}

Đây là kết quả DEMO.
Khi kết nối Telegram + Supabase,
nội dung bot trả lời sẽ được hiển thị
tại khu vực này.`;


    requestId.textContent =
        "ID yêu cầu: " + id;


    result.classList.add("show");

    checkBtn.disabled = false;

    loading.classList.remove("show");

}


/* =========================
   CHỐNG HTML INJECTION
========================= */

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   EVENTS
========================= */

checkBtn.addEventListener(
    "click",
    checkAccount
);

input.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            checkAccount();

        }

    }
);

</script>

</body>
</html>
